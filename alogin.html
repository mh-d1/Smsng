
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="refresh" content="3;url=$(link-redirect)">
<title>Berhasil Terhubung</title>
<style>
:root {
  color-scheme:dark; --bg:#000; --panel:#171717;
  --panel2:#222; --text:#f5f5f5; --muted:#a6a6a6;
  --accent:#d7e3ff; --accent-text:#101b30;
}
* { box-sizing:border-box; }
html,body { width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg); }
body { color:var(--text);font-family:"SamsungOne","Roboto","Arial",sans-serif; }
.screen {
  width:100%;height:100%;display:flex;flex-direction:column;
  padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));
}
main { width:100%;max-width:420px;margin:auto; }
.symbol {
  width:60px;height:60px;border-radius:21px;background:var(--panel);
  display:grid;place-items:center;font-size:25px;margin-bottom:26px;
}
.kicker { color:var(--muted);font-size:13px;margin-bottom:14px; }
h1 { font-size:clamp(36px,8vw,46px);line-height:1.1;letter-spacing:-1.5px;margin:0 0 14px; }
.desc { color:var(--muted);font-size:15px;line-height:1.65;margin:0 0 26px; }
.card { background:var(--panel);border-radius:22px;padding:18px;margin-bottom:20px; }
.row { display:flex;justify-content:space-between;gap:14px;padding:8px 0;font-size:13px; }
.label { color:var(--muted); }
.value { text-align:right;overflow-wrap:anywhere; }
button {
  width:100%;height:56px;border:0;border-radius:30px;
  background:var(--accent);color:var(--accent-text);
  font:inherit;font-weight:650;cursor:pointer;
}
.note { color:var(--muted);font-size:12px;text-align:center;margin-top:16px; }
@media(max-height:600px) {
  .screen { padding-top:12px;padding-bottom:12px; }
  .symbol { width:44px;height:44px;margin-bottom:12px; }
  h1 { font-size:32px; }
  .desc { margin-bottom:12px; }
  .card { padding:10px 16px;margin-bottom:12px; }
  button { height:48px; }
  .note { margin-top:8px; }
}
</style>
</head>
<body>
<div class="screen">
<main>
  <div class="symbol">✓</div>
  <div class="kicker">Koneksi jaringan</div>
  <h1>Kamu sudah terhubung.</h1>
  <p class="desc">Akses jaringan berhasil. Kamu akan dialihkan secara otomatis.</p>

  <section class="card">
    <div class="row">
      <span class="label">Nama pengguna</span>
      <span class="value">$(username)</span>
    </div>
    <div class="row">
      <span class="label">Alamat IP</span>
      <span class="value">$(ip)</span>
    </div>
    <div class="row">
      <span class="label">Status</span>
      <span class="value">Terhubung</span>
    </div>
  </section>

  <form action="$(link-redirect)" method="get">
    <button type="submit">Lanjutkan</button>
  </form>
  <div class="note">Pengalihan otomatis dalam 3 detik</div>
</main>
</div>
</body>
</html>
