
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Koneksi Bermasalah</title>
<style>
:root {
  color-scheme:dark; --bg:#000; --panel:#171717;
  --text:#f5f5f5; --muted:#a6a6a6; --line:#333;
  --accent:#d7e3ff; --accent-text:#101b30; --danger:#ffb4ab;
}
* { box-sizing:border-box; }
html,body { width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg); }
body { color:var(--text);font-family:"SamsungOne","Roboto","Arial",sans-serif; }
.screen {
  width:100%;height:100%;display:flex;flex-direction:column;
  padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));
}
main { width:100%;max-width:420px;margin:auto; }
.symbol {
  width:60px;height:60px;border-radius:21px;background:var(--panel);
  display:grid;place-items:center;color:var(--danger);
  font-size:27px;margin-bottom:26px;
}
.kicker { color:var(--muted);font-size:13px;margin-bottom:14px; }
h1 { font-size:clamp(34px,8vw,44px);line-height:1.1;letter-spacing:-1.4px;margin:0 0 14px; }
.desc { color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 22px; }
.error {
  border:1px solid var(--line);background:var(--panel);
  border-radius:22px;padding:18px;margin-bottom:20px;
}
.error-title { color:var(--danger);font-size:13px;margin-bottom:9px; }
.error-message { font-size:14px;line-height:1.6;overflow-wrap:anywhere; }
button {
  width:100%;height:56px;border:0;border-radius:30px;
  background:var(--accent);color:var(--accent-text);
  font:inherit;font-weight:650;cursor:pointer;
}
a { color:inherit;text-decoration:none; }
@media(max-height:600px) {
  .screen { padding-top:12px;padding-bottom:12px; }
  .symbol { width:44px;height:44px;margin-bottom:12px; }
  h1 { font-size:31px; }
  .desc { margin-bottom:12px; }
  .error { padding:12px 16px;margin-bottom:12px; }
  button { height:48px; }
}
</style>
</head>
<body>
<div class="screen">
<main>
  <div class="symbol">!</div>
  <div class="kicker">Koneksi jaringan</div>
  <h1>Tidak bisa terhubung.</h1>
  <p class="desc">Ada kendala saat mencoba masuk ke jaringan. Periksa informasi berikut, lalu coba lagi.</p>

  <section class="error">
    <div class="error-title">Informasi kesalahan</div>
    <div class="error-message">
      $(if error)$(error)$(else)Koneksi gagal. Silakan coba kembali.$(endif)
    </div>
  </section>

  <a href="$(link-login)">
    <button type="button">Coba lagi</button>
  </a>
</main>
</div>
</body>
</html>
