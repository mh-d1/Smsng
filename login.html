
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Wi-Fi Login</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000000;
  --surface: #171717;
  --surface-2: #222222;
  --text: #f5f5f5;
  --muted: #a6a6a6;
  --line: #333333;
  --accent: #d7e3ff;
  --accent-text: #101b30;
  --danger: #ffb4ab;
}
* { box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; margin: 0;
  overflow: hidden; background: var(--bg);
}
body {
  color: var(--text);
  font-family: "SamsungOne", "Roboto", "Arial", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.screen {
  width: 100%; height: 100%;
  min-height: 0;
  display: flex; flex-direction: column;
  padding: max(28px, env(safe-area-inset-top)) 24px
    max(24px, env(safe-area-inset-bottom));
}
.top {
  display: flex; justify-content: flex-end;
  min-height: 28px; align-items: center;
}
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #b9c9e8;
}
.content {
  width: 100%; max-width: 420px; margin: auto;
}
.eyebrow {
  font-size: 13px; color: var(--muted);
  margin-bottom: 18px; letter-spacing: .2px;
}
h1 {
  font-size: clamp(36px, 8vw, 48px);
  line-height: 1.08; letter-spacing: -1.7px;
  font-weight: 650; margin: 0 0 14px;
}
.subtitle {
  color: var(--muted); font-size: 15px;
  line-height: 1.55; margin: 0 0 32px;
}
form { display: flex; flex-direction: column; gap: 13px; }
.field {
  display: flex; flex-direction: column; gap: 9px;
}
label { font-size: 13px; color: #d0d0d0; }
input {
  width: 100%; height: 58px; border: 1px solid var(--line);
  border-radius: 18px; background: var(--surface);
  padding: 0 18px; color: var(--text);
  font: inherit; font-size: 15px; outline: none;
}
input:focus { border-color: #aebfdf; }
input::placeholder { color: #777777; }
button {
  height: 58px; border: 0; border-radius: 30px;
  margin-top: 8px; background: var(--accent);
  color: var(--accent-text); font: inherit;
  font-size: 15px; font-weight: 650; cursor: pointer;
}
button:active { opacity: .8; }
.error {
  color: var(--danger); font-size: 13px;
  line-height: 1.5; margin: 0 0 5px;
}
.bottom {
  min-height: 20px; display: flex;
  align-items: center; justify-content: center;
  color: #777777; font-size: 12px;
}
@media (min-width: 700px) {
  .screen { padding-left: 48px; padding-right: 48px; }
  .content { max-width: 400px; }
}
@media (max-height: 600px) {
  .screen { padding-top: 14px; padding-bottom: 12px; }
  .subtitle { margin-bottom: 18px; }
  h1 { font-size: 34px; }
  input, button { height: 48px; }
  form { gap: 9px; }
}
</style>
</head>
<body>
<div class="screen">
  <div class="top"><span class="dot"></span></div>

  <main class="content">
    <div class="eyebrow">Koneksi jaringan</div>
    <h1>Terhubung<br>ke internet.</h1>
    <p class="subtitle">
      Masuk menggunakan akun jaringan untuk melanjutkan.
    </p>

    <form name="login" action="$(link-login-only)" method="post">
      <input type="hidden" name="dst" value="$(link-orig)">
      <input type="hidden" name="popup" value="true">

      $(if error)
      <p class="error">$(error)</p>
      $(endif)

      <div class="field">
        <label for="username">Nama pengguna</label>
        <input id="username" name="username" type="text"
          placeholder="Masukkan nama pengguna"
          autocomplete="username" autocapitalize="none"
          spellcheck="false" required>
      </div>

      <div class="field">
        <label for="password">Kata sandi</label>
        <input id="password" name="password" type="password"
          placeholder="Masukkan kata sandi"
          autocomplete="current-password" required>
      </div>

      <button type="submit">Masuk</button>
    </form>
  </main>

  <div class="bottom">Koneksi aman dan siap digunakan</div>
</div>
</body>
</html>
