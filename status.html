
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Status Koneksi</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000; --panel: #171717; --panel2: #222;
  --text: #f5f5f5; --muted: #a6a6a6;
  --line: #333; --accent: #d7e3ff; --accent-text: #101b30;
}
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); }
body { color:var(--text); font-family:"SamsungOne","Roboto","Arial",sans-serif; }
.screen {
  width:100%; height:100%; display:flex; flex-direction:column;
  padding:max(24px,env(safe-area-inset-top)) 22px max(20px,env(safe-area-inset-bottom));
}
main { width:100%; max-width:480px; margin:auto; }
.kicker { color:var(--muted); font-size:13px; margin-bottom:12px; }
h1 { font-size:clamp(32px,7vw,42px); letter-spacing:-1.3px; margin:0 0 8px; }
.desc { color:var(--muted); font-size:14px; margin:0 0 24px; }
.card { background:var(--panel); border-radius:26px; padding:20px; }
.state { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
.check {
  width:42px; height:42px; display:grid; place-items:center;
  border-radius:15px; background:var(--panel2); font-size:21px;
}
.state strong { display:block; font-size:15px; margin-bottom:4px; }
.state small { color:var(--muted); font-size:12px; }
hr { border:0; border-top:1px solid var(--line); margin:0; }
.row {
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:16px; padding:14px 0;
}
.row:last-child { padding-bottom:0; }
.key { color:var(--muted); font-size:13px; }
.value {
  text-align:right; font-size:13px; max-width:58%;
  overflow-wrap:anywhere; font-variant-numeric:tabular-nums;
}
.actions { margin-top:18px; }
button {
  width:100%; height:56px; border:0; border-radius:30px;
  background:var(--accent); color:var(--accent-text);
  font:inherit; font-weight:650; cursor:pointer;
}
button:active { opacity:.8; }
@media(max-height:650px) {
  .screen { padding-top:12px; padding-bottom:12px; }
  h1 { font-size:30px; }
  .desc { margin-bottom:12px; }
  .card { padding:14px 18px; }
  .state { margin-bottom:12px; }
  .row { padding:9px 0; }
  button { height:48px; }
}
</style>
</head>
<body>
<div class="screen">
<main>
  <div class="kicker">Jaringan</div>
  <h1>Status koneksi</h1>
  <p class="desc">Informasi sesi internet kamu.</p>

  <section class="card">
    <div class="state">
      <div class="check">✓</div>
      <div>
        <strong>Terhubung</strong>
        <small>Sesi jaringan sedang aktif</small>
      </div>
    </div>
    <hr>
    <div class="row">
      <span class="key">Nama pengguna</span>
      <span class="value">$(username)</span>
    </div>
    <div class="row">
      <span class="key">Alamat IP</span>
      <span class="value">$(ip)</span>
    </div>
    <div class="row">
      <span class="key">Alamat MAC</span>
      <span class="value">$(mac)</span>
    </div>
    <div class="row">
      <span class="key">Durasi sesi</span>
      <span class="value">$(uptime)</span>
    </div>
    <div class="row">
      <span class="key">Sisa waktu</span>
      <span class="value">$(session-time-left)</span>
    </div>
    <div class="row">
      <span class="key">Data diterima</span>
      <span class="value">$(bytes-in-nice)</span>
    </div>
    <div class="row">
      <span class="key">Data dikirim</span>
      <span class="value">$(bytes-out-nice)</span>
    </div>
  </section>

  <form class="actions" action="$(link-logout)" method="post">
    <button type="submit">Keluar dari jaringan</button>
  </form>
</main>
</div>
</body>
</html>
